# Packet Browser Client Configuration
# Copy this file to ~/.config/packet-browser/config.ini or /etc/packet-browser/config.ini

[server]
# AGWPE TNC server address and port
agwpe_host = 127.0.0.1
agwpe_port = 8000

[session]
# Your amateur radio callsign
my_callsign = N0CALL

# Target node callsign to connect to
target_callsign = NODE1

# BPQ command to send after connection (e.g., WEB, BBS, etc.)
bpq_command = WEB

# Default transport used for startup auto-connect and Connect page.
# Values: ax25 (AGWPE), vara_fm, vara_hf
[transport]
default = ax25

# VARA HF / Mercury endpoint. Standard VARA HF ports are 8300/8301.
[vara_hf]
cmd_host = 127.0.0.1
cmd_port = 8300
data_host = 127.0.0.1
data_port = 8301
# bw250 | bw500 | bw2300 | bw2750
bandwidth = bw500

# VARA FM endpoint. Standard VARA FM ports are 8400/8401 (so both modems
# can run concurrently on the same host).
[vara_fm]
cmd_host = 127.0.0.1
cmd_port = 8400
data_host = 127.0.0.1
data_port = 8401
# vnarrow | vwide
bandwidth = vwide
